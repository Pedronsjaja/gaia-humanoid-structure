name: Integridade do acervo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verificar_acervo.py
